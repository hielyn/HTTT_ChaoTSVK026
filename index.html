        <script>
                (function () {
                    const rollBtn = document.getElementById('roll-btn');
                    const resetBtn = document.getElementById('reset-history-btn');
                    const displayNumber = document.getElementById('display-number');
                    const numberStage = document.getElementById('number-stage');
                    // const statusLabel = document.getElementById('status-label');
                    const resultSubtext = document.getElementById('result-subtext');
                    const progressBar = document.getElementById('progress-bar');
                    const btnIcon = document.getElementById('btn-icon');
                    const historyContainer = document.getElementById('history-container');
                    const emptyHistoryHint = document.getElementById('empty-history-hint');
                    const totalRollsEl = document.getElementById('total-rolls');

                    let isRolling = false;
                    let rollHistory = [];
                    let rollCount = 0;

                    const phrases = {
                        1: 'Số 1 - Đỏ',
                        2: 'Số 2 - Xanh lá',
                        3: 'Số 3 - Xanh dương'
                    };

                    function renderHistory() {
                        totalRollsEl.textContent = rollCount + ' lượt';
                        if (rollHistory.length === 0) {
                            historyContainer.innerHTML = '';
                            if (emptyHistoryHint) {
                                historyContainer.appendChild(emptyHistoryHint);
                            } else {
                                const hint = document.createElement('div');
                                hint.id = 'empty-history-hint';
                                hint.className = 'w-full text-center font-body-md text-body-md text-on-surface-variant py-1';
                                hint.textContent = 'Chưa có dữ liệu, hãy nhấn "Quay số ngay"';
                                historyContainer.appendChild(hint);
                            }
                            return;
                        }

                        historyContainer.innerHTML = '';
                        rollHistory.forEach((item, index) => {
                            const badge = document.createElement('div');
                            const isLatest = index === 0;
                            badge.className = 'flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl transition-all duration-300 ' +
                                (isLatest ? 'bg-primary text-on-primary shadow-sm scale-105' : 'bg-surface-container-highest text-on-surface');

                            badge.innerHTML = `
          <span class="font-label-sm text-label-sm opacity-70">#${item.id}</span>
          <span class="font-headline-md text-headline-md leading-none font-bold">${item.value}</span>
        `;
                            historyContainer.appendChild(badge);
                        });
                    }

                    function triggerRoll() {
                        if (isRolling) return;
                        isRolling = true;
                        rollBtn.disabled = true;
                        rollBtn.classList.add('opacity-90', 'scale-[0.99]');
                        // statusLabel.textContent = 'Đang quay...';
                        resultSubtext.textContent = 'Đang tính toán...';
                        btnIcon.classList.add('animate-spin');

                        displayNumber.classList.remove('text-secondary', 'text-primary');
                        displayNumber.classList.add('text-primary-container');

                        progressBar.style.width = '0%';
                        let progress = 0;
                        const progressInterval = setInterval(() => {
                            progress += 8;
                            if (progress <= 100) {
                                progressBar.style.width = progress + '%';
                            }
                        }, 25);

                        let shuffleCount = 0;
                        const maxShuffles = 14;
                        const shuffleInterval = setInterval(() => {
                            const tempNum = Math.floor(Math.random() * 3) + 1;
                            displayNumber.textContent = tempNum;
                            numberStage.style.transform = (shuffleCount % 2 === 0) ? 'scale(0.95) rotate(-2deg)' : 'scale(1.05) rotate(2deg)';
                            shuffleCount++;

                            if (shuffleCount >= maxShuffles) {
                                clearInterval(shuffleInterval);
                                clearInterval(progressInterval);
                                finalizeRoll();
                            }
                        }, 40);
                    }

                    function finalizeRoll() {
                        const finalResult = Math.floor(Math.random() * 3) + 1;
                        rollCount++;

                        displayNumber.textContent = finalResult;
                        displayNumber.classList.remove('text-primary-container');
                        displayNumber.classList.add('text-secondary');

                        numberStage.style.transform = 'scale(1.15)';
                        setTimeout(() => {
                            numberStage.style.transform = 'scale(1)';
                        }, 200);

                        // statusLabel.textContent = 'Đã chốt kết quả';
                        resultSubtext.textContent = phrases[finalResult] || ('Con số ' + finalResult);
                        progressBar.style.width = '100%';

                        rollHistory.unshift({ id: rollCount, value: finalResult });
                        if (rollHistory.length > 5) {
                            rollHistory.pop();
                        }
                        renderHistory();

                        setTimeout(() => {
                            isRolling = false;
                            rollBtn.disabled = false;
                            rollBtn.classList.remove('opacity-90', 'scale-[0.99]');
                            btnIcon.classList.remove('animate-spin');
                            // statusLabel.textContent = 'Sẵn sàng';
                            progressBar.style.width = '0%';
                        }, 350);
                    }

                    rollBtn.addEventListener('click', triggerRoll);

                    resetBtn.addEventListener('click', () => {
                        if (isRolling) return;
                        rollHistory = [];
                        rollCount = 0;
                        renderHistory();
                        displayNumber.textContent = '?';
                        displayNumber.classList.remove('text-secondary');
                        displayNumber.classList.add('text-primary');
                        resultSubtext.textContent = 'Chờ quay...';
                        // statusLabel.textContent = 'Đã đặt lại';
                        setTimeout(() => {
                            // statusLabel.textContent = 'Sẵn sàng';
                        }, 1000);
                    });

                    renderHistory();
                })();
        </script>
