<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>HTTT_ChaoTSV</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            "darkMode": "class",
            "theme": {
                "extend": {
                    "colors": {
                        "tertiary-container": "#865f00", "tertiary-fixed": "#ffdea8", "surface-dim": "#d9d9e2",
                        "on-secondary-container": "#00714a", "inverse-on-surface": "#f0f0f9", "tertiary-fixed-dim": "#ffba20",
                        "secondary-fixed": "#54feb3", "on-tertiary-container": "#ffe1b1", "outline-variant": "#c9c4d9",
                        "on-background": "#191b22", "primary-fixed": "#e5deff", "on-primary-fixed": "#190064",
                        "surface-bright": "#faf8ff", "on-primary": "#ffffff", "primary-container": "#6344f5",
                        "surface-container-highest": "#e2e2ea", "surface-variant": "#e2e2ea", "inverse-surface": "#2e3037",
                        "error": "#ba1a1a", "on-tertiary": "#ffffff", "secondary-container": "#50fcb1",
                        "on-secondary-fixed": "#002112", "tertiary": "#684900", "surface-container": "#ededf6",
                        "inverse-primary": "#c8bfff", "surface-tint": "#5b39ed", "on-surface": "#191b22",
                        "on-error-container": "#93000a", "surface-container-low": "#f3f3fc", "on-tertiary-fixed": "#271900",
                        "background": "#faf8ff", "secondary-fixed-dim": "#27e199", "outline": "#787587",
                        "on-primary-container": "#e8e2ff", "surface-container-high": "#e7e7f0", "primary": "#4a20dd",
                        "on-tertiary-fixed-variant": "#5e4200", "on-error": "#ffffff", "error-container": "#ffdad6",
                        "on-surface-variant": "#474556", "secondary": "#006c46", "surface": "#faf8ff",
                        "on-secondary": "#ffffff", "primary-fixed-dim": "#c8bfff", "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#420bd6", "on-secondary-fixed-variant": "#005234"
                    },
                    "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                    "spacing": {
                        "space-xs": "0.5rem", "space-2xl": "3rem", "space-2xs": "0.25rem", "space-lg": "1.5rem",
                        "margin-desktop": "2rem", "space-sm": "0.75rem", "space-xl": "2rem", "gutter": "1rem",
                        "space-md": "1rem", "margin-mobile": "1.25rem"
                    },
                    "fontFamily": {
                        "display-hero": ["Outfit"], "body-md": ["Plus Jakarta Sans"], "label-lg": ["Outfit"],
                        "headline-lg": ["Outfit"], "label-sm": ["Outfit"], "display-hero-mobile": ["Outfit"],
                        "body-lg": ["Plus Jakarta Sans"], "headline-md": ["Outfit"]
                    },
                    "fontSize": {
                        "display-hero": ["120px", { "lineHeight": "120px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "body-md": ["15px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-lg": ["16px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }],
                        "display-hero-mobile": ["88px", { "lineHeight": "92px", "letterSpacing": "-0.03em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
    <style>
        @layer base {

            html,
            body {
                width: 100%;
                margin: 0;
                padding: 0;
                min-height: 100%;
            }

            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }

            .pt-safe {
                padding-top: env(safe-area-inset-top, 0px);
            }

            main>:first-child {
                margin-top: 0 !important;
            }

            main>:last-child {
                margin-bottom: 0 !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body
    class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed">

    <main
        class="flex-1 w-full max-w-[440px] mx-auto pt-16 pb-24 px-margin-mobile bg-background flex flex-col justify-center">
        <div class="flex flex-col w-full gap-space-lg">
            <div class="flex flex-col items-center text-center space-y-space-2xs">
                <img src="typo.png" alt="Chào Tân sinh viên K2026 Khoa HTTT" class="w-full h-full object-cover">
            </div>

            <div
                class="relative w-full aspect-[4/3] rounded-3xl bg-surface-container-lowest shadow-xl flex flex-col items-center justify-center overflow-hidden">
                <div
                    class="absolute -top-16 -right-16 w-36 h-36 rounded-full bg-primary-fixed/40 blur-2xl pointer-events-none">
                </div>
                <div
                    class="absolute -bottom-16 -left-16 w-36 h-36 rounded-full bg-secondary-fixed/40 blur-2xl pointer-events-none">
                </div>
                
                <div class="relative z-10 flex flex-col items-center justify-center">
                    <div class="w-32 h-32 rounded-3xl bg-surface-container-low flex items-center justify-center shadow-inner transition-transform duration-200"
                        id="number-stage">
                        <span
                            class="font-display-hero-mobile text-display-hero-mobile text-primary select-none transition-all duration-150"
                            id="display-number">?</span>
                    </div>
                    <span class="mt-space-xs font-label-sm text-label-sm text-on-surface-variant"
                        id="result-subtext">Chờ quay...</span>
                </div>
                <div class="absolute bottom-0 inset-x-0 h-1.5 bg-surface-container">
                    <div class="h-full bg-primary w-0 transition-all duration-75 ease-out" id="progress-bar"></div>
                </div>
            </div>

            <div class="w-full flex flex-col items-center gap-space-xs">
                <button
                    class="w-full h-16 rounded-2xl bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-space-xs shadow-[0_6px_0_#420bd6] active:translate-y-1 active:shadow-[0_2px_0_#420bd6] transition-all cursor-pointer select-none"
                    id="roll-btn" type="button">
                    <span class="material-symbols-outlined text-[26px]" id="btn-icon">casino</span>
                    <span id="btn-text">Quay số ngay</span>
                </button>
            </div>

            <div class="w-full rounded-2xl bg-surface-container-low p-space-md flex flex-col gap-space-xs">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-space-2xs text-on-surface font-label-sm text-label-sm">
                        <span class="material-symbols-outlined text-[18px]">history</span>
                        <span>5 lần quay gần nhất</span>
                    </div>
                    <span class="font-label-sm text-label-sm text-on-surface-variant" id="total-rolls">0 lượt</span>
                </div>
                <div class="flex items-center justify-start gap-space-2xs overflow-x-auto py-space-2xs min-h-[52px]"
                    id="history-container">
                    <div class="w-full text-center font-body-md text-body-md text-on-surface-variant py-1"
                        id="empty-history-hint">
                        Chưa có dữ liệu, hãy nhấn 'Quay số ngay'
                    </div>
                </div>
            </div>
        </div>

        <script>
            (function () {
                const rollBtn = document.getElementById('roll-btn');
                const btnText = document.getElementById('btn-text');
                const displayNumber = document.getElementById('display-number');
                const numberStage = document.getElementById('number-stage');
                const resultSubtext = document.getElementById('result-subtext');
                const progressBar = document.getElementById('progress-bar');
                const btnIcon = document.getElementById('btn-icon');
                const historyContainer = document.getElementById('history-container');
                const emptyHistoryHint = document.getElementById('empty-history-hint');
                const totalRollsEl = document.getElementById('total-rolls');

                // Dữ liệu kho chạy ngầm (Không hiển thị ra màn hình)
                const inventory = {
                    1: { name: 'Số 1 - Đỏ', count: 200 },
                    2: { name: 'Số 2 - Xanh Dương', count: 198 },
                    3: { name: 'Số 3 - Xanh Lá', count: 198 }
                };

                let isRolling = false;
                let rollHistory = [];
                let rollCount = 0;

                // Thuật toán tính xác suất chạy ngầm theo trọng số tồn kho
                function getRandomByWeight() {
                    const totalAvailable = inventory[1].count + inventory[2].count + inventory[3].count;
                    if (totalAvailable <= 0) return null;

                    let random = Math.floor(Math.random() * totalAvailable);
                    if (random < inventory[1].count) return 1;
                    random -= inventory[1].count;

                    if (random < inventory[2].count) return 2;
                    return 3;
                }

                function renderHistory() {
                    totalRollsEl.textContent = rollCount + ' lượt';
                    if (rollHistory.length === 0) {
                        historyContainer.innerHTML = '';
                        if (emptyHistoryHint) {
                            historyContainer.appendChild(emptyHistoryHint);
                        } else {
                            const hint = document.createElement('div');
                            hint.id = 'empty-history-hint';
                            hint.className = 'w-full text-center font-body-md text-body-md text-on-surface-variant py-1';
                            hint.textContent = 'Chưa có dữ liệu, hãy nhấn "Quay số ngay"';
                            historyContainer.appendChild(hint);
                        }
                        return;
                    }

                    historyContainer.innerHTML = '';
                    rollHistory.forEach((item, index) => {
                        const badge = document.createElement('div');
                        const isLatest = index === 0;
                        badge.className = 'flex-shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-xl transition-all duration-300 ' +
                            (isLatest ? 'bg-primary text-on-primary shadow-sm scale-105' : 'bg-surface-container-highest text-on-surface');

                        badge.innerHTML = `
                            <span class="font-label-sm text-label-sm opacity-70">#${item.id}</span>
                            <span class="font-headline-md text-headline-md leading-none font-bold">${item.value}</span>
                        `;
                        historyContainer.appendChild(badge);
                    });
                }

                function triggerRoll() {
                    if (isRolling) return;

                    const winningNumber = getRandomByWeight();
                    if (!winningNumber) {
                        alert('Tất cả phần thưởng đã hết!');
                        btnText.textContent = 'Đã hết lượt';
                        rollBtn.disabled = true;
                        return;
                    }

                    isRolling = true;
                    rollBtn.disabled = true;
                    rollBtn.classList.add('opacity-90', 'scale-[0.99]');
                    resultSubtext.textContent = 'Đang tính toán...';
                    btnIcon.classList.add('animate-spin');

                    displayNumber.classList.remove('text-secondary', 'text-primary');
                    displayNumber.classList.add('text-primary-container');

                    progressBar.style.width = '0%';
                    let progress = 0;
                    const progressInterval = setInterval(() => {
                        progress += 8;
                        if (progress <= 100) {
                            progressBar.style.width = progress + '%';
                        }
                    }, 25);

                    let shuffleCount = 0;
                    const maxShuffles = 14;
                    const shuffleInterval = setInterval(() => {
                        const tempNum = Math.floor(Math.random() * 3) + 1;
                        displayNumber.textContent = tempNum;
                        numberStage.style.transform = (shuffleCount % 2 === 0) ? 'scale(0.95) rotate(-2deg)' : 'scale(1.05) rotate(2deg)';
                        shuffleCount++;

                        if (shuffleCount >= maxShuffles) {
                            clearInterval(shuffleInterval);
                            clearInterval(progressInterval);
                            finalizeRoll(winningNumber);
                        }
                    }, 40);
                }

                function finalizeRoll(finalResult) {
                    rollCount++;

                    // Trừ tồn kho ngầm
                    inventory[finalResult].count--;

                    displayNumber.textContent = finalResult;
                    displayNumber.classList.remove('text-primary-container');
                    displayNumber.classList.add('text-secondary');

                    numberStage.style.transform = 'scale(1.15)';
                    setTimeout(() => {
                        numberStage.style.transform = 'scale(1)';
                    }, 200);

                    resultSubtext.textContent = inventory[finalResult].name;
                    progressBar.style.width = '100%';

                    rollHistory.unshift({ id: rollCount, value: finalResult });
                    if (rollHistory.length > 5) {
                        rollHistory.pop();
                    }
                    renderHistory();

                    setTimeout(() => {
                        isRolling = false;
                        
                        const totalRemaining = inventory[1].count + inventory[2].count + inventory[3].count;
                        if (totalRemaining <= 0) {
                            btnText.textContent = 'Đã hết lượt';
                            rollBtn.disabled = true;
                        } else {
                            rollBtn.disabled = false;
                            rollBtn.classList.remove('opacity-90', 'scale-[0.99]');
                        }

                        btnIcon.classList.remove('animate-spin');
                        progressBar.style.width = '0%';
                    }, 350);
                }

                rollBtn.addEventListener('click', triggerRoll);
                renderHistory();
            })();
        </script>
    </main>
</body>

</html>
